name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.15"

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependencias de Python
        run: python -m pip install -e ".[dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar instalador
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_windows.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: BlackPDF-Windows
          path: packaging/out/*.exe

  linux:
    needs: tests
    # Ubuntu 22.04 (glibc 2.35) para que el paquete funcione en distribuciones de 2022 en adelante.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 dpkg-dev
          python -m venv .venv
          .venv/bin/python -m pip install PySide6-Essentials pymupdf pyhanko pyinstaller
      - name: Compilar AppImage y .deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: packaging/linux/build_linux.sh
      - uses: actions/upload-artifact@v5
        with:
          name: BlackPDF-Linux
          path: |
            packaging/out/*.AppImage
            packaging/out/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
